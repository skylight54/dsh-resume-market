name: 功能建议
description: 建议新模板、新导出格式或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法！说清楚「解决什么问题」比「加一个按钮」更有帮助。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 痛点
      description: 你在什么场景下觉得现在不好用？
      placeholder: "例如：投不同岗位需要不同侧重，但每次都得手动改一遍经历排序……"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望插件怎么做？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 面板界面 / 编辑器
        - 内置模板
        - 导出（HTML / Word / PDF）
        - 模板市场
        - agent 工具（resume_*）
        - AI 对话填写
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考
      description: 有没有别的插件、产品或简历模板可以参考？
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、草图、链接都行。
